name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build and release even if dev is unchanged since the last nightly'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compare.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version string
        id: version
        run: echo "version=nightly-$(date -u '+%Y-%m-%d')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for new commits since last nightly
        id: compare
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          LAST_SHA=$(git rev-parse -q --verify refs/tags/nightly-latest^{commit} || echo "")
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: ""
            name: ubuntu
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: ".exe"
            name: windows
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: ""
            name: macos
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: ""
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux system libs (required by Ebiten)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Build graphical
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w -X github.com/mechanical-lich/landing_party/internal/buildinfo.Version=${{ needs.check.outputs.version }}" -o dist/landing-party${{ matrix.suffix }} ./cmd/game

      - name: Stage release archive
        shell: bash
        run: |
          ARCHIVE=landing-party-nightly-${{ matrix.name }}-${{ matrix.goarch }}
          mkdir -p staging/$ARCHIVE
          cp dist/landing-party${{ matrix.suffix }} staging/$ARCHIVE/
          cp -r data staging/$ARCHIVE/
          cp -r assets staging/$ARCHIVE/

      - name: Zip (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ARCHIVE=landing-party-nightly-${{ matrix.name }}-${{ matrix.goarch }}
          cd staging && zip -r ../$ARCHIVE.zip $ARCHIVE/

      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "landing-party-nightly-${{ matrix.name }}-${{ matrix.goarch }}"
          Compress-Archive -Path "staging/$archive" -DestinationPath "$archive.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: landing-party-nightly-${{ matrix.name }}-${{ matrix.goarch }}
          path: landing-party-nightly-${{ matrix.name }}-${{ matrix.goarch }}.zip

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Move nightly-latest tag to current commit
        run: |
          git tag -f nightly-latest
          git push origin nightly-latest --force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-latest
          name: Nightly (latest)
          body: |
            Rolling nightly build from the tip of `dev`. Assets are replaced each night.

            Version: `${{ needs.check.outputs.version }}`
          files: dist/*.zip
          prerelease: true
